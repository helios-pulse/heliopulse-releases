configuration:
  lan_api_enabled:
    name: LAN API 접근
    description: 기본적으로 비활성화됩니다. 브라우저 접근에는 Home Assistant Ingress를 권장합니다.
  mqtt_mode:
    name: MQTT 모드
    description: auto는 Supervisor 브로커를, manual은 HelioPulse 설정을 사용하며 disabled는 MQTT를 끕니다.
  topic_prefix:
    name: MQTT 토픽 접두사
    description: HelioPulse 인스턴스마다 다른 접두사를 사용하세요.
  discovery_enabled:
    name: MQTT 자동 검색
    description: Home Assistant용 센서 검색 메시지를 발행합니다.
  discovery_prefix:
    name: 검색 접두사
    description: Home Assistant MQTT 통합의 검색 접두사와 일치해야 합니다.
